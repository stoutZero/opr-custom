name: Build and Push Docker Image

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set build date
        id: date
        run: echo "date=$(date -u +'%Y.%m.%d')" >> $GITHUB_OUTPUT

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest

      - name: Load version vars
        shell: bash
        run: |
          set +e
          source ./versions.sh
          set -e
          echo "UPSTREAM_IMG_V=$UPSTREAM_IMG_V" >> $GITHUB_ENV
          echo "RESTY_SRC_V=$RESTY_SRC_V" >> $GITHUB_ENV
          echo "NGX_V=$NGX_V" >> $GITHUB_ENV
          echo "NGX_UI_V=$NGX_UI_V" >> $GITHUB_ENV
          echo "S6_V=$S6_V" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build Docker image with custom script
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Push Docker image to GHCR
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            docker tag stoutZero/opr-custom:latest "$tag"
            docker push "$tag"
          done
